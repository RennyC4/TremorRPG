//
// stuff command line statements
//

stuffcmds

//
// set Tremor defaults - be careful when changing these as things can break, not recommended to mess with
//

con_savehistory 0
sv_sound_land ""
sv_sound_watersplash ""
scr_conspeed 9999
cl_bob 0
cl_rollangle 0
sv_gameplayfix_qwplayerphysics 1
sv_gameplayfix_findradiusdistancetobox 1
sv_bigcoords 1
m_preset_chosen 1
sys_clocktype 1 // fix for odd game speed 
sv_autosave 0
gl_blendsprites 1
v_gunkick 1
s_al_use_reverb 0
cl_lerp_driftfrac 1
seta m_preset_chosen 1
snd_ignoregamespeed 1
r_coronas_occlusion 2
r_sprite_backfacing 1 // oriented sprite fix
r_keepimages 1 // skybox fix
s_al_disable 2 // sound fix (disable OpenAL) for non-mono sounds
r_meshpitch 1 // fix mesh pitch
pr_droptofloorunits 99999 // match raisetoroof (qc command)
r_shadow_bumpscale_basetexture 1.75 // slight bump mapping with dlights
r_hdr_framebuffer 1 // HDR on
r_hdr_irisadaptation 1 // adapt to light/dark conditions
r_hdr_irisadaptation_maxvalue 1.5 // adjustment value
r_deluxemapping 0 // needs to be 0 with bumpscale base textures
r_shadow_shadowmapping 1 // draw shadow maps (stencil is faster however)
r_dynamic 0 // fixes odd ugly lighting
r_shadows 1 // realtime shadows, 2 causes insane texture flickering on bsp objects
r_coronas 1
sv_autooffload 1 // enable mapcluster stuff, do not disable
cl_lerp_smooth 1
r_shadow_realtime_world 1
r_renderscale 1 // higher breaks god rays and other screen effects
r_waterwarp 1
r_particledesc "classic high tsshaft"
v_deathtilt 0
sv_gameplayfix_stepdown 1
gl_texture_anisotropic_filtering 16
cl_sendguid 1 // Needed otherwise you'll loose your online character on servers
pm_slidefix 1 // help player physics on terrain
crosshair 1 // recommended
s_al_use_reverb 0
snd_device dsound

// this prevents data drops on dedicated servers / other real players
//sv_maxrate 0
//setinfo rate 0
//

sv_playerslots 255 // 255 is max per map cluster node, adjust for your PC

// Turn these off if anything breaks
mod_terrain_shadows 0 // Broken
mod_terrain_ambient 0 // Broken

vid_conautoscale 3 // font scaling

// Joystick disabled
in_xinput 0
joystick 0 // dinput disabled

//
// bind regular stuff
//

bind "TAB" "+showscores"
bind "`" "toggleconsole"
bind "F12" "screenshot"
bind "PAUSE" "pause"
bind "f1" "help"
bind "f9" "quit"
bind "esc" "togglemenu"
bind "t" "messagemode"

bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"
bind 9 "impulse 9"

// tremor
seta minimap "off"
seta tremor_lighting "simple"