//----------------------------------
// Associate models
//----------------------------------

r_effect "progs/flame.mdl" flame 1
r_effect "models/bonfire.glb" cu_flame 0
r_effect "models/candle.glb" candle 0
r_effect "models/candelabra.glb" candelabra 0
r_effect "models/chest.glb" chest 0
r_effect "models/barrel.glb" barrel 0
r_trail "models/arrow.glb" arrow 0
r_trail "models/arrow2.glb" arrow 0

//----------------------------------
// Effect Redirection
//----------------------------------

r_partredirect te_blood blood
r_partredirect te_blood2 blood
r_partredirect te_blood3 blood
r_partredirect wtorch2 wtorch1

//----------------------------------
// Setup Rain
//----------------------------------

r_part_rain 1
r_part_rain_quantity 4
r_particle_tracelimit 1000

//----------------------------------
// Other effects
//----------------------------------

r_bouncysparks 1
r_grenadetrail 1
r_rockettrail 1
r_part_sparks_trifan 1
r_part_rain 1
sv_nailhack 1

