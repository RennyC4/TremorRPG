// Water Fountain
//---------------

r_part fountain // stretched small splashes
{
	texture "particles/dirt_01"
	type texturedspark
	stretchfactor 0.1
	count 100
	scale 3 10
	scalefactor 1
	scaledelta 0
	alpha 0.2 0.3
	die 2
	veladd 0
	rgb 255 255 255
	blend premul_add
	spawnorg 7
	spawnvel 5
	spawnmode box
	randomvel 50 400
	gravity 300
	emit waterfall_splash
	emitinterval 0.1
	cliptype waterfall_splash
	clipcount 1
}

r_part +fountain // little streaks
{
	type spark
	count 50
	texture ""
	scale 0
	rgb 255 255 255
	alpha 0.3 0.5
	gravity 300
	spawnmode circle
	spawnorg 5 150
	die 0.5 1
	blend add
	randomvel 100
	veladd 200
	cliptype waterfall_splash
	clipcount 1
}


r_part +fountain // tall splashes
