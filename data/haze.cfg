r_part cu_flame // ascending flames
{
	texture "particles/fire_02"
	count 192 // 64
	scale 80 120
	scalefactor 1
	scaledelta -100
	alpha 0
	die 1 1.2
	randomvel 4 24
	veladd -24
	gravity -100
	rgb 255 160 128
	blend premul_add
